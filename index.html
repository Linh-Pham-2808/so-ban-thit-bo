<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Bán Thịt Bò</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Bò">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#9E1F2A">
<style>
:root{
  color-scheme:light;
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#1A1C19; --muted:#5C6259; --line:#D9DDD4;
  --accent:#9E1F2A; --accent-soft:#F6E3E4; --accent-ink:#FFFFFF;
  --ok:#1D7348; --ok-soft:#DDF0E5; --warn:#8A5A00; --warn-soft:#FBEFD5; --danger:#B42318;
  --shadow:0 1px 2px rgba(20,24,18,.06),0 4px 14px rgba(20,24,18,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#111311; --surface:#1B1E1B; --sunk:#252925; --ink:#EDEFEA; --muted:#A2A99F; --line:#2F342F;
    --accent:#E2575F; --accent-soft:#3A1D20; --accent-ink:#1A0B0C;
    --ok:#4FC48A; --ok-soft:#173326; --warn:#F2B84B; --warn-soft:#33280F; --danger:#FF7A6E;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;touch-action:manipulation}
html,body{background:var(--bg);margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink); font-size:18px; line-height:1.4;
  font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px calc(120px + env(safe-area-inset-bottom,0px))}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 10px}
.shop{font-weight:800;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.sync{font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.sync.ok{background:var(--ok-soft);color:var(--ok)}
.sync.wait{background:var(--warn-soft);color:var(--warn)}
.sync.off{background:var(--sunk);color:var(--muted)}
.cust{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:10px 16px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:17px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.custgrid{display:grid;gap:12px}
.custbig{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px 20px;text-align:left;min-height:100px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:var(--shadow);width:100%}
.custbig:active{transform:scale(.98);border-color:var(--accent)}
.custbig b{font-size:30px;font-weight:800;line-height:1.15;overflow-wrap:anywhere}
.custbig small{display:block;color:var(--muted);font-size:16px;font-weight:600;margin-top:4px}
.custbig .go{font-size:34px;color:var(--accent);font-weight:700;flex-shrink:0}
.back{font-weight:700;font-size:18px;color:var(--accent);min-height:48px;padding:0 4px 0 0}

.datebar{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:stretch;margin-bottom:16px}
.arrow{background:var(--surface);border:2px solid var(--line);border-radius:16px;font-size:30px;font-weight:700;min-height:64px}
.datebox{background:var(--surface);border:2px solid var(--line);border-radius:16px;text-align:center;padding:6px 4px;position:relative;display:flex;flex-direction:column;justify-content:center}
.datebox .d1{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.datebox .d2{font-size:22px;font-weight:700}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.today-pill{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:0 8px;font-size:13px;margin-left:6px;vertical-align:2px}

h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 10px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 14px;text-align:left;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.prod:active{transform:scale(.98);border-color:var(--accent)}
.prod b{font-size:23px;font-weight:700;line-height:1.15}
.prod span{color:var(--muted);font-size:15px}

.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px;border-top:1px solid var(--line);align-items:center;width:100%;text-align:left}
.row:first-child{border-top:0}
.row .name{font-weight:700;font-size:19px}
.row .calc{color:var(--muted);font-size:15px;grid-column:1}
.row .amt{font-weight:700;font-size:19px;grid-row:1/3;grid-column:2;text-align:right}
.row.confirm{background:var(--accent-soft);grid-template-columns:1fr}
.row.confirm .btns{display:flex;gap:8px;flex-wrap:wrap}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:16px 14px;background:var(--sunk);font-weight:800;font-size:20px;gap:12px}
.total small{font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.empty{padding:22px 14px;color:var(--muted);text-align:center;font-size:17px}
.hint{color:var(--muted);font-size:15px;margin:8px 2px 0}

.btn{border-radius:14px;padding:12px 18px;font-weight:700;font-size:18px;min-height:52px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:var(--surface)}
.btn.ghost{background:var(--surface);border:2px solid var(--line)}
.btn.danger{background:var(--danger);color:var(--surface)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}

.big{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.big .lbl{font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.big .val{font-size:34px;font-weight:800;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.big .sub{color:var(--muted);font-size:15px;margin-top:4px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.day{margin-top:14px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px;font-weight:700;gap:8px}
.dayhead span:last-child{color:var(--muted);font-size:16px}
.sumtable{width:100%;border-collapse:collapse;font-size:16px}
.sumtable td{padding:10px 14px;border-top:1px solid var(--line)}
.sumtable tr:first-child td{border-top:0}
.sumtable td.r{text-align:right;white-space:nowrap}

.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row .nm{font-weight:700;font-size:19px;overflow-wrap:anywhere}
.set-row .r{display:flex;gap:8px;align-items:center;flex-shrink:0}
.pricebtn{background:var(--sunk);border-radius:12px;padding:10px 12px;font-weight:700;min-height:48px}
.x{width:48px;height:48px;border-radius:12px;background:var(--sunk);font-size:20px;color:var(--muted)}
.addform{display:flex;gap:8px;margin-top:10px}
.inp{flex:1;min-width:0;width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.stack{display:grid;gap:10px}
.lab{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px;display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:5}
.tab{border-radius:14px;padding:10px 4px;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:100%;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:26px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{background:var(--surface);border:3px solid var(--line);border-radius:16px;padding:8px 12px;text-align:left}
.field[aria-pressed="true"]{border-color:var(--accent)}
.field .fl{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.field .fv{font-size:28px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.field.solo{grid-column:1/-1}
.result{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px;font-size:18px;gap:8px}
.result b{font-size:26px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.key{background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:28px;font-weight:700;min-height:62px;box-shadow:var(--shadow)}
.key:active{background:var(--sunk)}
.key.fn{background:var(--sunk);font-size:22px}
.sheet-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.sheet-btns .btn{min-height:62px;font-size:21px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:528px;margin:0 auto;background:var(--ok);color:var(--surface);padding:14px 16px;border-radius:14px;font-weight:700;z-index:20;box-shadow:var(--shadow)}
.toast.err{background:var(--danger)}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:16px;margin-bottom:12px;display:block;width:100%;text-align:left}
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .18s ease-out} @keyframes up{from{transform:translateY(30px);opacity:.6}} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="nhap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nhập hàng</button>
  <button class="tab" role="tab" data-tab="so"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg>Sổ tháng</button>
  <button class="tab" role="tab" data-tab="gia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Cài đặt</button>
</nav>
<div id="layer"></div>
<input type="file" id="restorefile" accept=".json,application/json" hidden>

<script>
const SEED = null;
const BUILD = 'v6';   // tăng cùng với version.json mỗi lần cập nhật app
(() => {
const $ = (s, r=document) => r.querySelector(s);
const app = $('#app'), layer = $('#layer');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(n).toLocaleString('vi-VN');
const kg = n => (Math.round(n*100)/100).toLocaleString('vi-VN', {maximumFractionDigits:2});
const pad2 = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const fromIso = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const WD = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const dmy = s => { const d = fromIso(s); return pad2(d.getDate())+'/'+pad2(d.getMonth()+1); };
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate()+n); return iso(d); };
const monthLabel = m => { const [y,mm] = m.split('-'); return 'Tháng '+Number(mm)+'/'+y; };
const addMonth = (m, n) => { const [y,mm] = m.split('-').map(Number); const d = new Date(y, mm-1+n, 1); return d.getFullYear()+'-'+pad2(d.getMonth()+1); };
const newId = () => 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const WEEK = 7*24*3600*1000;

/* ---------- local storage (the only copy on this phone) ---------- */
const KEY = 'so-ban-thit-bo';
let D;
function blank(){ return {orders:[], settings:{products:[], customers:[]}, sync:{url:'', key:'', lastOk:0}, queue:{up:{}, del:[]}, lastFile:0}; }
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { D = Object.assign(blank(), JSON.parse(raw)); return; } } catch(e) {}
  D = blank();
  if (SEED) { D.orders = SEED.orders; D.settings = SEED.settings; }
  persist();
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(D)); return true; }
  catch(e) { toast('Không lưu được vào máy (bộ nhớ đầy?). Hãy sao lưu ngay.', true); return false; }
}
load();
if (D.sync.url && D.sync.verified === undefined) { D.sync.verified = true; persist(); }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e) {}

const S = { tab:'nhap', date: iso(new Date()), bookMonth: iso(new Date()).slice(0,7), customer:null, confirmId:null, syncing:false, syncErr:'' };
try { S.tab = sessionStorage.getItem('tab') || 'nhap'; S.customer = localStorage.getItem(KEY+'-cust'); } catch(e) {}
if (D.orders.length && !D.orders.some(o => o.date.slice(0,7) === S.bookMonth)) {
  // open the book on the latest month that has data
  S.bookMonth = D.orders.map(o => o.date.slice(0,7)).sort().pop();
}

const products = () => D.settings.products || [];
const customers = () => (D.settings.customers && D.settings.customers.length) ? D.settings.customers : ['Khách lẻ'];
const curCustomer = () => { const cs = customers(); return cs.includes(S.customer) ? S.customer : cs[0]; };
const byCust = list => { const c = curCustomer(); return list.filter(o => (o.customer || customers()[0]) === c); };
const sortOrders = list => list.slice().sort((a,b) => a.date.localeCompare(b.date) || (a.at||0)-(b.at||0));
const ordersOfMonth = m => D.orders.filter(o => o.date.slice(0,7) === m);

/* ---------- giá riêng từng khách + món khách hay mua ---------- */
// D.settings.custPrices = {khách: {món: giá}} — nhớ giá lần nhập gần nhất của từng khách
const custOf = o => o.customer || customers()[0];
function priceFor(c, p){ const cp = (D.settings.custPrices || {})[c]; return cp && cp[p.name] > 0 ? cp[p.name] : p.price; }
const hasOwnPrice = (c, p) => { const cp = (D.settings.custPrices || {})[c]; return !!(cp && cp[p.name] > 0); };
function setCustPrice(c, item, price){
  const all = D.settings.custPrices = D.settings.custPrices || {};
  all[c] = all[c] || {};
  if (price > 0) all[c][item] = price; else delete all[c][item];
}
function buildCustPrices(){
  D.settings.custPrices = {};
  sortOrders(D.orders).forEach(o => setCustPrice(custOf(o), o.item, o.price));
}
// Món khách hay mua (số ngày có mua trong 60 ngày gần đây, rồi tới lần mua gần nhất) lên đầu
function prodsFor(c){
  const since = addDays(iso(new Date()), -60), days = {}, last = {};
  D.orders.forEach(o => {
    if (custOf(o) !== c) return;
    if (!last[o.item] || o.date > last[o.item]) last[o.item] = o.date;
    if (o.date >= since) (days[o.item] = days[o.item] || new Set()).add(o.date);
  });
  const list = products().map((p,i) => ({p, i, n: days[p.name] ? days[p.name].size : 0, last: last[p.name] || ''}));
  return {
    fav: list.filter(x => x.last).sort((a,b) => b.n-a.n || b.last.localeCompare(a.last) || a.i-b.i),
    rest: list.filter(x => !x.last),
  };
}
if (!D.settings.custPrices) { buildCustPrices(); persist(); }

/* ---------- Google Sheets backup ---------- */
function parseSyncInput(rawUrl, rawKey){
  const t = String(rawUrl || '').trim();
  const m = t.match(/https:\/\/script\.google\.com\/[^\s?#]*?\/exec/);
  const k = String(rawKey || '').trim() || ((t.match(/[?&]key=([^&#\s]+)/) || [])[1] ? decodeURIComponent(t.match(/[?&]key=([^&#\s]+)/)[1]) : '');
  return {url: m ? m[0] : t, key: k, ok: !!m};
}
const pending = () => Object.keys(D.queue.up).length + D.queue.del.length;
function queueUp(o){ D.queue.up[o.id] = o; }
function queueDel(id){ delete D.queue.up[id]; if (!D.queue.del.includes(id)) D.queue.del.push(id); }
async function flush(){
  if (!D.sync.url || !D.sync.verified || S.syncing || !pending()) return;
  if (!navigator.onLine) return;
  S.syncing = true; S.syncErr = ''; refreshSync();
  try {
    const del = D.queue.del.slice();
    const ups = Object.values(D.queue.up);
    for (let i = 0; i === 0 || i < ups.length; i += 200) {
      const batch = ups.slice(i, i+200);
      const body = {key:D.sync.key, xoa: i === 0 ? del : [], dong: batch.map(({id,date,customer,item,qty,price}) => ({id,date,customer,item,qty,price}))};
      const r = await fetch(D.sync.url, {method:'POST', body: JSON.stringify(body)});
      const j = await r.json();
      if (!j.ok) throw new Error(j.loi === 'sai mã' ? 'Sai mã bí mật' : (j.loi || 'lỗi'));
      if (i === 0) D.queue.del = D.queue.del.filter(id => !del.includes(id));
      batch.forEach(o => { if (D.queue.up[o.id] === o) delete D.queue.up[o.id]; });
      if (!ups.length) break;
    }
    D.sync.lastOk = Date.now(); persist();
  } catch(e) {
    S.syncErr = e.message && e.message !== 'Failed to fetch' && e.message !== 'Load failed' ? e.message : 'Chưa gửi được (mạng?)';
  }
  S.syncing = false; refreshSync();
}
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') flush(); });
setInterval(flush, 60000);

function refreshSync(){
  document.querySelectorAll('.syncslot').forEach(el => el.innerHTML = syncChip());
  // Cài đặt hiện chi tiết sao lưu: vẽ lại khi không có bảng nào đang mở và không đang gõ
  const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (S.tab === 'gia' && !P && !layer.innerHTML && !typing) render();
}
function syncChip(){
  if (!D.sync.url) return `<button class="sync off" data-act="gotoset">Chưa cài sao lưu</button>`;
  if (!D.sync.verified) return `<button class="sync wait" data-act="gotoset">Sao lưu chưa kiểm tra</button>`;
  if (S.syncing) return `<span class="sync wait">Đang sao lưu…</span>`;
  const n = pending();
  if (n) return `<button class="sync wait" data-act="flush">Chờ sao lưu ${n} dòng</button>`;

let P = null;
function openPad(cfg){ P = cfg; P.active = P.active || 0; drawPad(); }
function closeLayer(){ P = null; layer.innerHTML = ''; }
const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) ? n : 0; };
const showVal = f => f.dec ? (f.val === '' ? '0' : f.val) : (f.val === '' ? '0' : money(num(f.val)));
function drawPad(){
  const f = P.fields, a = f[P.active];
  const total = f.length === 2 ? num(f[0].val)*num(f[1].val) : null;
  layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-label="${esc(P.title)}">
    <h3><span>${esc(P.title)}</span>${P.onDelete ? '<button class="btn ghost" data-act="paddel" style="font-size:16px;min-height:44px">Xóa dòng</button>' : ''}</h3>
    <div class="fields">${f.map((x,i) => `<button class="field ${f.length===1?'solo':''}" data-act="field" data-i="${i}" aria-pressed="${i===P.active}"><div class="fl">${esc(x.label)}</div><div class="fv"><span id="fv${i}">${showVal(x)}</span> <small style="font-size:16px">${x.unit}</small></div></button>`).join('')}</div>
    ${total!==null ? `<div class="result"><span>Thành tiền</span><b id="padres">${money(total)} đ</b></div>` : '<div style="height:12px"></div>'}
    <div class="pad">
      ${['1','2','3','4','5','6','7','8','9'].map(k => `<button class="key" data-k="${k}">${k}</button>`).join('')}
      <button class="key fn" id="padfn" data-k="${a.dec ? ',' : '000'}">${a.dec ? ',' : '000'}</button>
      <button class="key" data-k="0">0</button>
      <button class="key fn" data-k="del" aria-label="Xóa số">⌫</button>
    </div>
    <div class="sheet-btns"><button class="btn ghost" data-act="close">Hủy</button><button class="btn ok" data-act="padsave">LƯU</button></div>
  </div></div>`;
}
// Đổi số trên bảng nhập mà không vẽ lại cả bảng (vẽ lại làm bảng nháy và iPhone tưởng chạm 2 lần)
function updatePad(){
  const f = P.fields, a = f[P.active];
  f.forEach((x,i) => {
    const v = $('#fv'+i); if (v) v.textContent = showVal(x);
    const b = layer.querySelector(`.field[data-i="${i}"]`); if (b) b.setAttribute('aria-pressed', String(i === P.active));
  });
  const res = $('#padres'); if (res) res.textContent = money(num(f[0].val)*num(f[1].val)) + ' đ';
  const fn = $('#padfn'); if (fn) { const k = a.dec ? ',' : '000'; fn.dataset.k = k; fn.textContent = k; }
}
function padKey(k){
  const f = P.fields[P.active];
  if (P.fresh && P.fresh[P.active]) { f.val = ''; P.fresh[P.active] = false; }
  if (k === 'del') f.val = f.val.slice(0,-1);
  else if (k === ',') { if (!f.val.includes(',')) f.val = (f.val || '0') + ','; }
  else {
    if (f.dec && f.val.includes(',') && f.val.split(',')[1].length >= 2) return;
    if (f.val.replace(',','').length >= 12) return;
    f.val = (f.val === '0' ? '' : f.val) + k;
    if (!f.dec) f.val = f.val.replace(/^0+(?=\d)/,'');
  }
  updatePad();
}
const toField = (n, dec) => n ? (dec ? kg(n).replace(/\./g,'') : String(Math.round(n))) : '';

function openEntry(prod, existing){
  openPad({
    title: existing ? existing.item : prod.name,
    fields: [
      {key:'qty', label:'Số ký', unit:'kg', val: existing ? toField(existing.qty, true) : '', dec:true},
      {key:'price', label:'Đơn giá', unit:'đ', val: toField(existing ? existing.price : priceFor(curCustomer(), prod), false), dec:false},
    ],
    fresh: [false, true],
    onDelete: existing ? () => { closeLayer(); S.confirmId = existing.id; render(); } : null,
    onSave: v => {
      if (!(v.qty > 0)) { toast('Hãy nhập số ký.', true); return false; }
      if (!(v.price > 0)) { toast('Hãy nhập đơn giá.', true); return false; }
      const item = existing ? existing.item : prod.name;
      const o = { id: existing ? existing.id : newId(), date:S.date, customer:curCustomer(), item, qty:Math.round(v.qty*100)/100, price:Math.round(v.price), at: existing ? existing.at : Date.now() };
      D.orders = D.orders.filter(x => x.id !== o.id); D.orders.push(o); queueUp(o);
      // nhớ giá cho khách này, trừ khi đang sửa một ngày cũ hơn lần mua gần nhất
      if (!D.orders.some(x => custOf(x) === o.customer && x.item === item && x.date > o.date)) setCustPrice(o.customer, item, o.price);
      if (!persist()) return false;
      toast(`Đã lưu: ${item} ${kg(o.qty)} kg = ${money(o.qty*o.price)} đ`);
      render(); flush(); return true;
    }
  });
}

/* ---------- files: share to Zalo / save ---------- */
async function shareFile(file, title){
  try {
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title}); return true; }
  } catch(e) { if (e.name === 'AbortError') return false; }
  // Fallback: plain download
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  return true;
}
function readySheet(file, title, note){
  // Sharing must start from a tap, so show a button once the file is ready.
  layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog">
    <h3>Đã tạo xong</h3>
    <p class="hint" style="margin:0 0 14px">${note}</p>
    <div class="stack"><button class="btn pri wide" id="dosend" style="min-height:64px;font-size:21px">Gửi</button>
    <button class="btn ghost wide" data-act="close">Đóng</button></div></div></div>`;
  $('#dosend').onclick = async () => { const ok = await shareFile(file, title); if (ok) closeLayer(); };
}

function monthCsv(){
  const rows = sortOrders(byCust(ordersOfMonth(S.bookMonth)));
  const q = s => '"'+String(s).replace(/"/g,'""')+'"';
  const out = [['Ngày','Món','Số lượng','Đơn giá','Thành tiền'].map(q).join(',')];

const libs = {};
function loadScript(src){
  return libs[src] = libs[src] || new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete libs[src]; rej(new Error('load')); }; document.head.appendChild(s);
  });
}

// Số tiền bằng chữ (VD 6275000 → "Sáu triệu hai trăm bảy mươi lăm nghìn đồng")
function docSo(n){
  n = Math.round(n);
  if (!n) return 'Không đồng';
  const d = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const read3 = (x, full) => {
    const tr = Math.floor(x/100), ch = Math.floor(x%100/10), dv = x%10, s = [];
    if (full || tr) s.push(d[tr] + ' trăm');
    if (ch === 0) { if (dv && (full || tr)) s.push('lẻ'); }
    else s.push(ch === 1 ? 'mười' : d[ch] + ' mươi');
    if (dv) s.push(dv === 1 && ch > 1 ? 'mốt' : dv === 5 && ch > 0 ? 'lăm' : d[dv]);
    return s.join(' ');
  };
  const units = ['', ' nghìn', ' triệu', ' tỷ'], g = [];
  while (n > 0) { g.push(n % 1000); n = Math.floor(n/1000); }
  const parts = [];
  for (let i = g.length-1; i >= 0; i--) if (g[i]) parts.push(read3(g[i], i < g.length-1) + units[i]);
  const s = parts.join(' ');
  return s[0].toUpperCase() + s.slice(1) + ' đồng';
}

// Bảng kê bán hàng gửi khách. perPage=0 → một trang dài (ảnh); có số → các trang A4 (PDF)
function paperPages(perPage){
  const rows = sortOrders(byCust(ordersOfMonth(S.bookMonth)));
  const total = rows.reduce((s,o)=>s+Math.round(o.qty*o.price),0);
  const shop = D.settings.shop || {};
  const [y, m] = S.bookMonth.split('-').map(Number);
  const monthEnd = new Date(y, m, 0), today = new Date();
  const to = monthEnd < today ? monthEnd : today;
  const fmt = dt => pad2(dt.getDate())+'/'+pad2(dt.getMonth()+1)+'/'+dt.getFullYear();

  // Chia trang: trang đầu có phần đầu, trang cuối cần chỗ cho tổng tiền + chữ ký
  const chunks = [];
  if (!perPage) chunks.push(rows);
  else {
    const FIRST = 20, NEXT = 28, FOOT = 9;
    let i = 0, first = true;
    while (i < rows.length) { const n = first ? FIRST : NEXT; chunks.push(rows.slice(i, i+n)); i += n; first = false; }
    if (!chunks.length) chunks.push([]);
    const lastCap = chunks.length === 1 ? FIRST : NEXT;
    if (chunks[chunks.length-1].length > lastCap - FOOT) chunks.push([]);
  }

  const FONT = "'Helvetica Neue',Helvetica,Arial,sans-serif";
  const td = 'padding:7px 8px;border:1px solid #b9bdb4;vertical-align:top;';
  const th = td + 'background:#eef0ea;font-weight:700;font-size:13px;';
  const r = 'text-align:right;white-space:nowrap;', c = 'text-align:center;';
  let stt = 0;

  return chunks.map((list, pi) => {
    const isFirst = pi === 0, isLast = pi === chunks.length-1;
    const body = list.map(o => { stt++;
      return `<tr><td style="${td}${c}">${stt}</td><td style="${td}white-space:nowrap">${dmy(o.date)}/${o.date.slice(0,4)}</td>
        <td style="${td}">${esc(o.item)}</td><td style="${td}${c}">kg</td><td style="${td}${r}">${kg(o.qty)}</td>
        <td style="${td}${r}">${money(o.price)}</td><td style="${td}${r}">${money(Math.round(o.qty*o.price))}</td></tr>`; }).join('');

    const head = !isFirst ? '' : `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding-bottom:14px;border-bottom:2px solid #9E1F2A">
        <div>
          ${shop.name ? `<div style="font-size:21px;font-weight:800;text-transform:uppercase;color:#9E1F2A">${esc(shop.name)}</div>` : ''}
          ${shop.addr ? `<div style="margin-top:3px">Địa chỉ: ${esc(shop.addr)}</div>` : ''}
          ${shop.phone ? `<div style="margin-top:3px">Điện thoại: ${esc(shop.phone)}</div>` : ''}
        </div>
        <div style="text-align:right;white-space:nowrap;color:#444">Ngày lập: ${fmt(today)}</div>
      </div>
      <div style="text-align:center;margin:24px 0 6px;font-size:26px;font-weight:800;letter-spacing:1px">BẢNG KÊ BÁN HÀNG</div>
      <div style="text-align:center;color:#444;margin-bottom:20px">Từ ngày ${fmt(new Date(y, m-1, 1))} đến ngày ${fmt(to)}</div>
      <div style="margin-bottom:12px;font-size:16px">Khách hàng: <b>${esc(curCustomer())}</b></div>`;

    const table = (!list.length && !isFirst) ? '' : `
      <table style="width:100%;border-collapse:collapse">
        <tr><td style="${th}${c}width:44px">STT</td><td style="${th}width:104px">Ngày</td><td style="${th}">Tên hàng</td><td style="${th}${c}width:46px">ĐVT</td>
          <td style="${th}${r}width:90px">Số lượng</td><td style="${th}${r}width:100px">Đơn giá</td><td style="${th}${r}width:130px">Thành tiền</td></tr>
        ${body}
        ${isLast ? `<tr><td colspan="6" style="${td}text-align:right;font-weight:800;font-size:16px">TỔNG CỘNG</td><td style="${td}${r}font-weight:800;font-size:16px">${money(total)}</td></tr>` : ''}
      </table>`;

    const foot = !isLast ? '' : `
      ${!list.length && !isFirst ? `<div style="text-align:right;font-weight:800;font-size:16px;border-top:2px solid #111;padding-top:8px">TỔNG CỘNG: ${money(total)} đ</div>` : ''}
      <div style="margin-top:12px">Số tiền bằng chữ: <i>${docSo(total)}.</i></div>
      ${shop.bank ? `<div style="margin-top:14px;padding:10px 12px;border:1px dashed #9E1F2A;border-radius:6px">Thông tin chuyển khoản: <b>${esc(shop.bank)}</b></div>` : ''}
      <div style="display:flex;justify-content:space-around;margin-top:34px;text-align:center">
        <div><b>Người mua hàng</b><div style="color:#666;font-size:13px;margin-top:2px">(Ký, ghi rõ họ tên)</div></div>
        <div><b>Người lập bảng</b><div style="color:#666;font-size:13px;margin-top:2px">(Ký, ghi rõ họ tên)</div></div>
      </div>
      <div style="height:${perPage ? 0 : 90}px"></div>`;

    return `<div style="width:794px;${perPage ? 'height:1123px;' : ''}padding:44px 48px;box-sizing:border-box;background:#fff;color:#111;font-family:${FONT};font-size:14px;line-height:1.4;position:relative">
      ${head}${table}${foot}
      ${perPage && chunks.length > 1 ? `<div style="position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#777;font-size:12px">Trang ${pi+1}/${chunks.length}</div>` : ''}
    </div>`;
  });
}
async function renderPaper(html){
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;left:-10000px;top:0;';
  box.innerHTML = html; document.body.appendChild(box);
  try { return await window.html2canvas(box.firstElementChild, {scale:2, backgroundColor:'#ffffff', logging:false}); }
  finally { box.remove(); }
}
function busy(msg){ layer.innerHTML = `<div class="scrim"><div class="sheet"><h3>${esc(msg)}</h3><p class="hint">Chờ vài giây…</p></div></div>`; }
async function exportFile(kind){
  const name = 'bang-ke-' + slug(curCustomer()) + '-' + S.bookMonth;
  busy(kind === 'pdf' ? 'Đang tạo bảng kê PDF' : 'Đang tạo ảnh bảng kê');
  try {
    await loadScript(H2C);
    let file;
    if (kind === 'pdf') {
      await loadScript(JSPDF);
      const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
      const pages = paperPages(1);
      for (let i = 0; i < pages.length; i++) {
        const c = await renderPaper(pages[i]);
        if (i) pdf.addPage();
        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297);
      }
      file = new File([pdf.output('blob')], name + '.pdf', {type:'application/pdf'});
    } else {
      const c = await renderPaper(paperPages(0)[0]);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      file = new File([blob], name + '.png', {type:'image/png'});
    }
    readySheet(file, monthLabel(S.bookMonth), 'Bấm <b>Gửi</b>, chọn <b>Zalo</b> trong danh sách, rồi chọn người nhận.');
  } catch(_) { closeLayer(); toast('Không tạo được file. Lần đầu cần có mạng, hãy thử lại.', true); }
}
function zaloSheet(){
  layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-label="Gửi qua Zalo">
    <h3>Gửi sổ ${esc(monthLabel(S.bookMonth).toLowerCase())}</h3>
    <div class="stack">
      <button class="btn pri wide" data-act="mkpdf" style="min-height:64px;font-size:20px">Gửi bảng kê PDF</button>
      <button class="btn ghost wide" data-act="mkimg" style="min-height:64px;font-size:20px">Gửi ảnh bảng kê (xem ngay trong Zalo)</button>
      <button class="btn ghost wide" data-act="close">Đóng</button>
    </div></div></div>`;
}
function custPriceSheet(c){
  const {fav, rest} = prodsFor(c);
  const rows = fav.concat(rest).map(x => {
    const own = hasOwnPrice(c, x.p);
    return `<div class="set-row"><span class="nm">${esc(x.p.name)}${own ? '' : '<br><small style="color:var(--muted);font-weight:600;font-size:14px">giá chung</small>'}</span><span class="r">
      <button class="pricebtn" data-act="cpset" data-i="${x.i}">${money(priceFor(c, x.p))} đ</button>
      ${own ? `<button class="x" data-act="cpclear" data-i="${x.i}" aria-label="Bỏ giá riêng ${esc(x.p.name)}">✕</button>` : ''}</span></div>`;
  }).join('');
  layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" data-c="${esc(c)}">
    <h3>Giá riêng · ${esc(c)}</h3>
    <p class="hint" style="margin:0 0 10px">Bấm vào giá để đổi giá cho riêng khách này. Bấm ✕ để quay về giá chung.</p>
    <div class="list">${rows || '<div class="empty">Chưa có món nào.</div>'}</div>
    <button class="btn ghost wide" data-act="close" style="margin-top:12px">Đóng</button></div></div>`;
}
function showText(txt){
  layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet"><h3>Chọn hết rồi sao chép</h3>
    <textarea id="copytxt" readonly class="inp" style="height:50vh;font-size:15px">${esc(txt)}</textarea>
    <button class="btn ghost wide" data-act="close" style="margin-top:10px">Đóng</button></div></div>`;
  const ta = $('#copytxt'); ta.focus(); ta.select();
}

/* ---------- restore ---------- */
function applyRestore(orders, settings){
  D.orders = orders;
  if (settings) D.settings = settings;
  if (!products().length) { // rebuild price list from the latest price of each item
    const last = {}; sortOrders(orders).forEach(o => last[o.item] = o.price);
    D.settings.products = Object.entries(last).map(([name, price]) => ({name, price}));
  }
  if (!(D.settings.customers || []).length) D.settings.customers = [...new Set(orders.map(o => o.customer).filter(Boolean))];
  if (!settings || !settings.custPrices) buildCustPrices();
  D.queue = {up:{}, del:[]};
  persist(); render();
  toast(`Đã khôi phục ${orders.length} dòng.`);
}

let toastT;
function toast(msg, err){
  let t = $('.toast'); if (!t) { t = document.createElement('div'); document.body.appendChild(t); }
  t.className = 'toast'+(err?' err':''); t.textContent = msg; t.setAttribute('role','status');
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 4500 : 2600);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const key = e.target.closest('[data-k]');
  if (key && P) { padKey(key.dataset.k); return; }
  const tab = e.target.closest('.tab');
  if (tab) { if (tab.dataset.tab === 'nhap') S.picked = false; S.tab = tab.dataset.tab; S.confirmId = null; try { sessionStorage.setItem('tab', S.tab); } catch(_){} render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'scrim') { if (e.target === el) closeLayer(); return; }
  if (act === 'close') { closeLayer(); return; }
  if (act === 'field') { P.active = +el.dataset.i; updatePad(); return; }
  if (act === 'paddel') { P.onDelete(); return; }
  if (act === 'padsave') { const v = {}; P.fields.forEach(f => v[f.key] = num(f.val)); const after = P.after; if (P.onSave(v) !== false) { closeLayer(); if (after) after(); } return; }
  if (act === 'custprices') { custPriceSheet(D.settings.customers[+el.dataset.i]); return; }
  if (act === 'cpset') {
    const c = layer.querySelector('.sheet').dataset.c, p = products()[+el.dataset.i];
    openPad({ title:'Giá '+p.name+' – '+c, fields:[{key:'price', label:'Giá mỗi ký', unit:'đ', val:String(priceFor(c, p)), dec:false}], fresh:[true],
      after: () => custPriceSheet(c),
      onSave: v => { if (!(v.price>0)) { toast('Hãy nhập giá.', true); return false; }
        setCustPrice(c, p.name, Math.round(v.price)); persist(); toast(`${c} · ${p.name}: ${money(v.price)} đ/kg`); return true; } });
    return;
  }
  if (act === 'cpclear') {
    const c = layer.querySelector('.sheet').dataset.c, p = products()[+el.dataset.i];
    setCustPrice(c, p.name, 0); persist(); custPriceSheet(c); toast(`${c} · ${p.name}: dùng giá chung`); return;
  }
  if (act === 'day') { S.date = addDays(S.date, +el.dataset.v); S.confirmId = null; render(); return; }
  if (act === 'month') { S.bookMonth = addMonth(S.bookMonth, +el.dataset.v); render(); return; }
  if (act === 'pickcust') { S.customer = el.dataset.v; S.picked = true; S.date = iso(new Date()); S.confirmId = null; try { localStorage.setItem(KEY+'-cust', S.customer); } catch(_){} render(); window.scrollTo(0,0); return; }
  if (act === 'unpick') { S.picked = false; S.confirmId = null; render(); window.scrollTo(0,0); return; }
  if (act === 'cust') { S.customer = el.dataset.v; try { localStorage.setItem(KEY+'-cust', S.customer); } catch(_){} render(); return; }
  if (act === 'pick') { openEntry(products()[+el.dataset.i]); return; }
  if (act === 'edit') { const o = D.orders.find(x => x.id === el.dataset.id); if (o) openEntry(null, o); return; }
  if (act === 'nodel') { S.confirmId = null; render(); return; }
  if (act === 'del') {
    const id = el.dataset.id; S.confirmId = null;
    D.orders = D.orders.filter(o => o.id !== id); queueDel(id); persist(); render(); toast('Đã xóa'); flush(); return;
  }
  if (act === 'gotoset') { S.tab = 'gia'; render(); setTimeout(() => { const s = $('#saoluu'); if (s) s.scrollIntoView({behavior:'smooth'}); }, 50); return; }
  if (act === 'flush') { flush(); return; }
  if (act === 'price') {
    const i = +el.dataset.i, p = products()[i];
    openPad({ title:'Giá '+p.name, fields:[{key:'price', label:'Giá mỗi ký', unit:'đ', val:String(p.price), dec:false}], fresh:[true],
      onSave: v => { if (!(v.price>0)) { toast('Hãy nhập giá.', true); return false; }
        D.settings.products[i].price = Math.round(v.price); persist(); render(); toast(`Giá ${p.name}: ${money(v.price)} đ/kg`); return true; } });
    return;
  }
  if (act === 'askprod') { S.confirmId = 'p'+el.dataset.i; render(); return; }
  if (act === 'askcust') { S.confirmId = 'c'+el.dataset.i; render(); return; }
  if (act === 'delprod') { D.settings.products.splice(+el.dataset.i, 1); S.confirmId = null; persist(); render(); return; }
  if (act === 'delcust') { D.settings.customers.splice(+el.dataset.i, 1); S.confirmId = null; persist(); render(); return; }
  if (act === 'zalo') { zaloSheet(); return; }
  if (act === 'mkpdf') { exportFile('pdf'); return; }
  if (act === 'mkimg') { exportFile('img'); return; }
  if (act === 'copy') {
    const txt = monthText();
    try { await navigator.clipboard.writeText(txt); toast('Đã sao chép. Mở Zalo và dán vào.'); } catch(_) { showText(txt); }
    return;
  }
  if (act === 'csv') {
    const f = new File([monthCsv()], 'so-' + slug(curCustomer()) + '-' + S.bookMonth + '.csv', {type:'text/csv'});
    await shareFile(f, monthLabel(S.bookMonth)); return;
  }
  if (act === 'saveshop') {
    const v = id => $(id).value.trim();
    D.settings.shop = {name:v('#shopname'), phone:v('#shopphone'), addr:v('#shopaddr'), bank:v('#shopbank')};
    persist(); toast('Đã lưu thông tin cửa hàng.'); return;
  }
  if (act === 'synctest') {
    const {url, key: k, ok} = parseSyncInput($('#syncurl').value, $('#synckey').value);
    D.sync.url = url; D.sync.key = k; persist();
    $('#syncurl').value = url; $('#synckey').value = k;
    if (!ok) { toast('Chưa thấy link /exec. Lấy ở Apps Script → Triển khai → Quản lý triển khai → URL ứng dụng web.', true); return; }
    if (!k) { toast('Hãy nhập mã bí mật.', true); return; }
    el.disabled = true; el.textContent = 'Đang kiểm tra…';
    try {
      const r = await fetch(url + '?key=' + encodeURIComponent(k));
      const j = await r.json();
      if (!j.ok) throw new Error(j.loi === 'sai mã' ? 'Sai mã bí mật. Mã phải giống hệt trong code.' : 'Sheets báo lỗi: ' + (j.loi || ''));
      const first = !D.sync.verified;
      D.sync.verified = true;
      if (first) D.orders.forEach(queueUp); // first time: upload everything already on the phone
      persist(); S.syncErr = '';
      toast(first ? `Kết nối được! Đang gửi ${D.orders.length} dòng lên Sheets…` : 'Kết nối được!');
      render(); flush();
    } catch(err) {
      el.disabled = false; el.textContent = 'Lưu và kiểm tra';
      toast(err.message && !/fetch|Load failed|JSON/i.test(err.message) ? err.message : 'Không kết nối được. Kiểm tra lại link (phải là bản “Ứng dụng web”, quyền “Bất kỳ ai”).', true);
    }
    return;
  }
  if (act === 'pushall') { D.orders.forEach(queueUp); persist(); flush(); toast('Đang gửi lại toàn bộ sổ…'); return; }
  if (act === 'pull') {
    if (!confirm('Thay sổ trong máy bằng sổ trên Google Sheets?')) return;
    try {
      const r = await fetch(D.sync.url + '?key=' + encodeURIComponent(D.sync.key)); const j = await r.json();
      if (!j.ok) throw 0;
      applyRestore(j.rows.map((o,i) => ({...o, at:i})), null);
    } catch(_) { toast('Không tải được từ Sheets.', true); }
    return;
  }
  if (act === 'backupfile') {
    const f = new File([JSON.stringify({app:'so-ban-thit-bo', v:1, at:Date.now(), orders:D.orders, settings:D.settings})], 'sao-luu-so-bo-' + iso(new Date()) + '.json', {type:'application/json'});
    if (await shareFile(f, 'Sao lưu sổ')) { D.lastFile = Date.now(); persist(); render(); }
    return;
  }
  if (act === 'openfile') { $('#restorefile').click(); return; }
});
$('#restorefile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'so-ban-thit-bo' || !Array.isArray(j.orders)) throw 0;
    if (!confirm(`File có ${j.orders.length} dòng. Thay sổ trong máy bằng file này?`)) return;
    applyRestore(j.orders, j.settings);
    if (D.sync.url) { D.orders.forEach(queueUp); persist(); flush(); }
  } catch(_) { toast('File này không phải file sao lưu của app.', true); }
});
let syncDraftT;
document.addEventListener('input', e => {
  if (e.target.id !== 'syncurl' && e.target.id !== 'synckey') return;
  clearTimeout(syncDraftT);
  syncDraftT = setTimeout(() => {
    const {url, key} = parseSyncInput($('#syncurl').value, $('#synckey').value);
    if (url === D.sync.url && key === D.sync.key) return;
    D.sync.url = url; D.sync.key = key; D.sync.verified = false; persist();
  }, 400);
});
document.addEventListener('change', e => { if (e.target.id === 'pickdate' && e.target.value) { S.date = e.target.value; render(); } });
document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target.dataset.form, input = e.target.querySelector('input'), name = input.value.trim();
  if (!name) { input.focus(); return; }
  if (form === 'prod') {
    if (products().some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('Món này đã có.', true); return; }
    D.settings.products.push({name, price:0}); persist(); render(); toast('Đã thêm “'+name+'”. Bấm vào giá để nhập giá.');
  } else {
    D.settings.customers = D.settings.customers || [];
    if (D.settings.customers.includes(name)) { toast('Khách này đã có.', true); return; }
    D.settings.customers.push(name); persist(); render(); toast('Đã thêm khách “'+name+'”.');
  }
});

render(); flush();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// Có bản mới trên mạng → hiện nút cập nhật (iPhone hay giữ app cũ trong bộ nhớ, không tự tải lại)
let lastCheck = 0;
async function checkUpdate(){
  if (Date.now() - lastCheck < 60000 || !navigator.onLine) return;
  lastCheck = Date.now();
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    const j = await r.json();
    if (j.build && j.build !== BUILD && !$('#updbar')) {
      const b = document.createElement('button');
      b.id = 'updbar'; b.className = 'banner';
      b.style.cssText = 'position:fixed;left:16px;right:16px;top:calc(8px + env(safe-area-inset-top,0px));z-index:30;max-width:528px;margin:0 auto;width:auto;background:var(--ok);color:var(--surface);font-weight:700;text-align:center;box-shadow:var(--shadow)';
      b.textContent = 'Có bản mới – bấm để cập nhật';
      b.onclick = async () => {
        b.textContent = 'Đang cập nhật…';
        try { const reg = await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch(_) {}
        location.reload();
      };
      document.body.appendChild(b);
    }
  } catch(_) {}
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
})();
